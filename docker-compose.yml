# Ubuntu（Hyper-V、メモリ 9.7GiB）用。DB 約3GB・Web 約2GB に制限する。
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dwgfind}
      POSTGRES_USER: ${POSTGRES_USER:-dwgfind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
    command: >
      postgres -c shared_buffers=1GB -c effective_cache_size=2GB
               -c work_mem=16MB -c maintenance_work_mem=256MB -c max_connections=40
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  web:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MEDIA_ROOT: /app/media
    ports:
      - "8000:8000"
    volumes:
      - ./data/media:/app/media
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
