{% load static %}<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}DWG-FIND{% endblock %}</title>
<link rel="stylesheet" href="{% static 'drawings/app.css' %}"></head>
<body><div class="wrap">
{% if user.is_authenticated %}
<header class="top"><a href="{% url 'index' %}" style="color:inherit;text-decoration:none"><b>DWG-FIND</b><small>図面検索</small></a>
  <span class="muted" style="font-size:13px">{{ user.get_username }}
  {% if user.is_staff %} ・ <a href="/admin/">管理</a>{% endif %} ・
  <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button type="submit">ログアウト</button></form></span>
</header>
{% endif %}
{% block content %}{% endblock %}
</div></body></html>
